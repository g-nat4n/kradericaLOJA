services:
  mysql:
    image: mysql:8.4
    container_name: vesta-mysql
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER:-vesta}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vesta}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "3307:3306"
    volumes:
      - vesta_mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  vesta_mysql:
